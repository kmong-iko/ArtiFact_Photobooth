<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photobooth</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2d0000; }

  /* Stage keeps the Figma frame's proportions (982:550) and covers the viewport.
     All positions below are percentages of that frame. */
  #stage {
    --w: max(100vw, calc(100vh * 982 / 550));
    position: absolute; left: 50%; top: 50%;
    width: var(--w); aspect-ratio: 982 / 550;
    transform: translate(-50%, -50%);
    background: url("assets/background.jpg") center / 100% 100% no-repeat;
  }
  @media (max-aspect-ratio: 1/1) { #stage { --w: 100vw; } } /* portrait: show whole composition */

  /* Static decorations: no animation, never interactive. */
  .decor { position: absolute; inset: 0; pointer-events: none; user-select: none; }
  .decor img, .decor p { position: absolute; display: block; margin: 0; }
  #doily  { left: 15.78%; top: 11.09%; width: 69.25%; height: 78.55%; }
  #tape   { left: 1.33%;  top: 15.41%; width: 26.68%; transform: rotate(-11deg); }
  #camera { left: 15.09%; top: 6.37%;  width: 19.62%; transform: rotate(6deg); }
  #seal   { left: 71.47%; top: 5.92%;  width: 14.49%; transform: rotate(-10deg); }
  #art    { left: 82.08%; top: 28.89%; width: 16.50%; }
  #cookie { left: 7.29%;  top: 47.35%; width: 10.88%; transform: rotate(-16deg); }
  #apple  { left: 15.28%; top: 55.83%; width: 15.47%; transform: rotate(8deg); }
  #heart  { left: 73.58%; top: 61.68%; width: 18.42%; transform: rotate(16deg); }
  #ladybug{ left: 67.23%; top: 71.75%; width: 6.58%;  transform: rotate(45deg); }
  #credit {
    left: 33.6%; top: 3.6%; white-space: nowrap; color: #fff7ea;
    font: 400 calc(var(--w) * 0.0235)/1.1 "Snell Roundhand", "Segoe Script", "Lucida Handwriting", "Brush Script MT", cursive;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .55);
  }

  /* Dark red oval = live camera area. Sits above the doily, below the stickers that overlap it. */
  #oval {
    position: absolute; left: 22.5%; top: 19.5%; width: 54.58%; height: 61.4%;
    border-radius: 50%; overflow: hidden; background: #2d0000;
    display: flex; align-items: center; justify-content: center;
  }
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); /* mirror preview only */
  }
  #msg {
    position: relative; z-index: 2; margin: 0; padding: 0 10%; text-align: center;
    font: italic 600 calc(var(--w) * 0.03)/1.25 Georgia, "Times New Roman", serif;
    color: #fff6e6; text-shadow: 0 2px 8px rgba(0, 0, 0, .6);
  }
  #oval.cover::after { content: ""; position: absolute; inset: 0; background: rgba(45, 0, 0, .6); }
  #oval.error { cursor: pointer; }

  /* Small capture control, fixed bottom-right (ghosted white camera outline as in the design). */
  #shutter {
    position: fixed; right: 2%; bottom: 3%; z-index: 5;
    width: 44px; height: 44px; padding: 0; cursor: pointer;
    background: transparent; border: 0; display: grid; place-items: center;
  }
  #shutter svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 1.5; opacity: .7; }
  #shutter:hover svg, #shutter:focus-visible svg { opacity: 1; }
  #shutter:disabled { cursor: default; }
  #shutter:disabled svg { opacity: .35; }
</style>
</head>
<body>
<div id="stage">
  <div class="decor" aria-hidden="true">
    <img id="doily" src="assets/doily.webp" alt="">
  </div>

  <div id="oval">
    <video id="video" autoplay playsinline muted></video>
    <p id="msg" hidden></p>
  </div>

  <div class="decor" aria-hidden="true">
    <p id="credit">Brought to you by ArtiFact’s Creators</p>
    <img id="tape" src="assets/tape.webp" alt="">
    <img id="camera" src="assets/camera.webp" alt="">
    <img id="seal" src="assets/seal.webp" alt="">
    <img id="art" src="assets/art.webp" alt="">
    <img id="cookie" src="assets/cookie.webp" alt="">
    <img id="apple" src="assets/apple.webp" alt="">
    <img id="heart" src="assets/heart.webp" alt="">
    <img id="ladybug" src="assets/ladybug.webp" alt="">
  </div>
</div>

<button id="shutter" type="button" aria-label="Take photo" disabled>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    <circle cx="12" cy="13" r="3.8"/>
  </svg>
</button>

<canvas id="canvas" hidden></canvas>

<script>
(() => {
  const oval = document.getElementById("oval");
  const video = document.getElementById("video");
  const msg = document.getElementById("msg");
  const shutter = document.getElementById("shutter");
  const canvas = document.getElementById("canvas");
  let stream = null, starting = false, retryTimer = null;

  function showMessage(text, cls) { msg.textContent = text; msg.hidden = false; oval.className = cls || ""; }
  function hideMessage() { msg.hidden = true; oval.className = ""; }
  function stopStream() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; video.srcObject = null; shutter.disabled = true;
  }
  function retryLater(ms) { clearTimeout(retryTimer); retryTimer = setTimeout(startCamera, ms); }

  async function startCamera() {
    if (starting) return;
    clearTimeout(retryTimer);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMessage(window.isSecureContext
        ? "Camera not supported on this device."
        : "Camera needs https:// or localhost.", "error");
      return;
    }
    starting = true;
    try {
      stopStream();
      showMessage("Starting camera…");
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      // Public display: if the camera drops (unplugged, sleep), recover automatically.
      stream.getVideoTracks().forEach(t => t.addEventListener("ended", () => {
        stopStream(); showMessage("Camera disconnected. Reconnecting…", "error"); retryLater(3000);
      }));
      video.srcObject = stream;
      await video.play();
      hideMessage();
      shutter.disabled = false;
    } catch (err) {
      const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
      const none = err && (err.name === "NotFoundError" || err.name === "OverconstrainedError");
      showMessage(denied ? "Camera access is blocked. Allow it in your browser, then tap here to retry."
        : none ? "No camera found. Plug one in and tap here to retry."
        : "Couldn't start the camera. Tap here to retry.", "error");
      if (!denied) retryLater(5000); // keep trying quietly unless the user must act
    } finally { starting = false; }
  }

  function capture() {
    if (!video.videoWidth || shutter.disabled) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0); // un-mirrored original
    shutter.disabled = true;
    canvas.toBlob(blob => {
      if (!blob) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "photobooth-" + new Date().toISOString().replace(/[:.]/g, "-") + ".jpg";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }, "image/jpeg", 0.92);

    showMessage("Pose captured—your masterpiece is in the making!", "cover");
    setTimeout(() => { hideMessage(); shutter.disabled = !stream; }, 3000);
  }

  shutter.addEventListener("click", capture);
  oval.addEventListener("click", () => { if (oval.classList.contains("error")) startCamera(); });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !stream && !oval.classList.contains("cover")) startCamera();
  });
  startCamera();
})();
</script>
</body>
</html>
